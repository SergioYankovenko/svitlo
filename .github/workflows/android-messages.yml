name: Publish Android announcements
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-announcements
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Export public projection
        run: node scripts/android-messages/export.mjs android-messages.json
        env:
          ANDROID_MESSAGES_EXPORT_KEY: ${{ secrets.ANDROID_MESSAGES_EXPORT_KEY }}
      - name: Commit only the public feed
        run: |
          if git diff --quiet -- android-messages.json && git ls-files --error-unmatch android-messages.json >/dev/null 2>&1; then exit 0; fi
          git config user.name 'svitlo-announcements'
          git config user.email 'announcements@users.noreply.github.com'
          git add -- android-messages.json
          git commit -m 'Update public Android announcements'
          git push origin HEAD:main
      - name: Request the existing branch-based Pages build explicitly
        run: node scripts/android-messages/request-pages-build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
