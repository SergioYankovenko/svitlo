name: Build private VPS artifact
on:
  workflow_dispatch:
  push:
    branches: [codex/pwa-live-44-59-20261106, codex/pwa-live-43-60-20261106, codex/regional-collector-20261105, codex/settlement-background-20261105, codex/discovery-throughput-20261105, codex/pwa-live-24-28-release-20261105, codex/phone-qr-pilot-20261105, codex/architecture-hardening-20261104, codex/kyiv-regions-20261104, codex/pwa-cache-20261104, codex/paired-source-history-20261104, codex/pwa-live-v2-20261104, codex/kyiv-address-display-20261104, codex/main-app-subscription-vps-20261105, codex/pwa-next-20261105, codex/settlement-routing-20261105, codex/pwa-geography-audit-20261105]
permissions:
  contents: read
concurrency:
  group: vps-stage-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: svitlo_owner
          POSTGRES_PASSWORD: isolated-history-ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U svitlo_owner" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: bash -n vps/ops/release.sh
      - run: npm test
      - run: node --test vps/*.test.mjs vps/sensors/*.test.mjs vps/maps/*.test.mjs vps/regions/*.test.mjs vps/universal/*.test.mjs vps/telemetry/*.test.mjs
      - run: node --check vps/discovery/integration.mjs && node --check vps/discovery/regional-integration.mjs
      - run: node --test vps/geography/*.test.mjs
      - run: node --test vps/discovery/*.test.mjs
      - run: node vps/regions/source-history-ci.mjs
      - name: Build once outside VPS; no server credentials or deployment
        run: |
          mkdir -p artifact
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -f vps/Dockerfile -t svitlo-stage-ci:artifact .
          docker save svitlo-stage-ci:artifact | gzip > artifact/image.tar.gz
          git archive HEAD | gzip > artifact/source.tar.gz
          export IMAGE_ID=$(docker image inspect svitlo-stage-ci:artifact --format '{{.Id}}')
          node vps/ops/manifest.mjs artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vps-stage-${{ github.sha }}
          path: artifact/
          retention-days: 1
          compression-level: 0
