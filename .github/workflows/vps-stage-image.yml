name: Build private VPS artifact
on:
  workflow_dispatch:
  push:
    branches: [codex/pwa-live-63-64-20261106, codex/pwa-live-62-20261106, codex/pwa-live-45r6-20261106, codex/pwa-live-44-59-20261106, codex/pwa-live-43-60-20261106, codex/regional-collector-20261105, codex/settlement-background-20261105, codex/discovery-throughput-20261105, codex/pwa-live-24-28-release-20261105, codex/phone-qr-pilot-20261105, codex/architecture-hardening-20261104, codex/kyiv-regions-20261104, codex/pwa-cache-20261104, codex/paired-source-history-20261104, codex/pwa-live-v2-20261104, codex/kyiv-address-display-20261104, codex/main-app-subscription-vps-20261105, codex/pwa-next-20261105, codex/settlement-routing-20261105, codex/pwa-geography-audit-20261105]
permissions:
  contents: read
concurrency:
  group: vps-stage-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: svitlo_owner
          POSTGRES_PASSWORD: isolated-history-ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U svitlo_owner" --health-interval 5s --health-timeout 5s --health-retries 12
      meilisearch:
        image: getmeili/meilisearch@sha256:b7ba431bf6f9b26cc86132798f3640964147a699cf23f026b74c6c05dbb1d60d
        env:
          MEILI_MASTER_KEY: isolated-search-ci-key
          MEILI_NO_ANALYTICS: 'true'
        ports: ['7700:7700']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: bash -n vps/ops/release.sh
      - run: npm test
      - run: node --test vps/*.test.mjs vps/sensors/*.test.mjs vps/maps/*.test.mjs vps/regions/*.test.mjs vps/universal/*.test.mjs vps/telemetry/*.test.mjs
      - run: node --check vps/discovery/integration.mjs && node --check vps/discovery/regional-integration.mjs
      - run: node --test vps/geography/*.test.mjs
      - run: node --test vps/discovery/*.test.mjs
      - run: node vps/regions/source-history-ci.mjs
      - run: node --test vps/events/*.test.mjs
      - run: node --test vps/observability/*.test.mjs
      - run: node --test vps/sources/*.test.mjs
      - run: node --test vps/catalog/*.test.mjs
      - run: node --test vps/admin/*.test.mjs
      - run: node --test vps/identity/*.test.mjs
      - run: node --test vps/modules/*.test.mjs
      - run: node --test vps/billing/*.test.mjs
      - run: node --test vps/planning/*.test.mjs vps/notifications/*.test.mjs vps/migration/*.test.mjs vps/charging/*.test.mjs
      - run: node admin/build.mjs
      - run: node --test vps/search/*.test.mjs
      - run: node vps/search/ci.mjs
      - run: node vps/events/ci.mjs
      - name: Build once outside VPS; no server credentials or deployment
        run: |
          mkdir -p artifact
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -f vps/Dockerfile -t svitlo-stage-ci:artifact .
          docker save svitlo-stage-ci:artifact | gzip > artifact/image.tar.gz
          git archive HEAD | gzip > artifact/source.tar.gz
          export IMAGE_ID=$(docker image inspect svitlo-stage-ci:artifact --format '{{.Id}}')
          node vps/ops/manifest.mjs artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vps-stage-${{ github.sha }}
          path: artifact/
          retention-days: 1
          compression-level: 0

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build PostgreSQL extensions outside VPS
        run: |
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -f vps/database/Dockerfile -t svitlo-database-ci:artifact .
          docker run -d --name database-module-qa -e POSTGRES_HOST_AUTH_METHOD=trust svitlo-database-ci:artifact -c shared_preload_libraries=pg_stat_statements
          for attempt in $(seq 1 30); do if docker exec database-module-qa pg_isready -U postgres; then break; fi; sleep 1; done
          docker exec database-module-qa psql -v ON_ERROR_STOP=1 -U postgres -c 'create extension postgis; create extension pg_stat_statements; select postgis_version(); select count(*) from pg_stat_statements;'
          mkdir database-artifact
          docker save svitlo-database-ci:artifact | gzip > database-artifact/image.tar.gz
          docker image inspect svitlo-database-ci:artifact --format '{{.Id}}' > database-artifact/image-id.txt
          docker exec database-module-qa pgbackrest version > database-artifact/pgbackrest-version.txt
          sha256sum database-artifact/image.tar.gz > database-artifact/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: database-modules-${{ github.sha }}
          path: database-artifact/
          retention-days: 1
          compression-level: 0
