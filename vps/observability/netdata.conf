[global]
    run as user = netdata
    update every = 2
[directories]
    host access prefix = /host
[db]
    mode = ram
    retention = 1800
[web]
    bind to = *
    default port = 19999
[plugins]
    apps = no
    python.d = no
    go.d = no
    perf = no
    ebpf = no
    charts.d = no
    statsd = no
    cgroups = no
    tc = no
    nfacct = no
[ml]
    enabled = no
[registry]
    enabled = no
